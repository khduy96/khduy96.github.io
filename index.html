* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000 100%);
  font-family: "Segoe UI", Tahoma, sans-serif;
  cursor: crosshair;
  user-select: none;
}

#canvas {
  position: fixed;
  inset: 0;
  display: block;
}

.overlay {
  position: fixed;
  top: 12%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  color: #fff;
  padding: 0 16px;
  width: 100%;
}

.overlay h1 {
  font-size: clamp(2.2rem, 8vw, 5rem);
  letter-spacing: 4px;
  background: linear-gradient(90deg, #ff4e50, #f9d423, #4facfe, #c471f5, #ff4e50);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 6s linear infinite;
  filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));
}

.overlay p {
  margin-top: 10px;
  font-size: clamp(0.85rem, 2.5vw, 1.1rem);
  opacity: 0.7;
  animation: fade 2.5s ease-in-out infinite alternate;
}

@keyframes shine {
  to {
    background-position: 300% 0;
  }
}

@keyframes fade {
  from { opacity: 0.35; }
  to { opacity: 0.85; }
}

/* ===== Bottom UI: text input + buttons ===== */
.ui {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: min(560px, calc(100% - 32px));
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.overlay,
.ui {
  transition: opacity 0.6s;
}

.panel {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 14px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 14px;
  background: rgba(10, 16, 28, 0.55);
  backdrop-filter: blur(8px);
  color: #fff;
}

.panel label {
  font-size: 0.85rem;
  opacity: 0.8;
}

.panel textarea {
  width: 100%;
  resize: vertical;
  min-height: 70px;
  padding: 8px 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.35);
  color: #ffe8c7;
  font: 1rem/1.5 "Segoe UI", Tahoma, sans-serif;
  user-select: text;
  cursor: text;
  outline: none;
}

.panel textarea:focus {
  border-color: #f9d423;
}

.panel small {
  font-size: 0.75rem;
  opacity: 0.6;
  line-height: 1.4;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.controls button.primary {
  background: linear-gradient(90deg, #ff9a3c, #f9d423);
  color: #1a1000;
  border-color: transparent;
  font-weight: 600;
}

/* ===== Show mode: only the sky, nothing else ===== */
body.show {
  cursor: none;
  touch-action: none;
  -webkit-touch-callout: none;
}

body.show .overlay,
body.show .ui {
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
}

.controls button {
  padding: 10px 18px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  font-size: 0.95rem;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: background 0.2s, transform 0.1s;
}

.controls button:hover {
  background: rgba(255, 255, 255, 0.18);
}

.controls button:active {
  transform: scale(0.95);
}

.controls button.active {
  border-color: #f9d423;
  box-shadow: 0 0 12px rgba(249, 212, 35, 0.4);
}
</style>

<body class="show"><!-- opens straight into the show -->
  <canvas id="canvas"></canvas>

  <div class="overlay">
    <h1>Chúc Mừng!</h1>
    <p>Click hoặc chạm vào màn hình để bắn pháo hoa và bật âm thanh</p>
  </div>

  <div class="ui">
    <div class="panel">
      <label for="textInput">Nội dung chữ trình diễn</label>
      <textarea id="textInput" rows="4" spellcheck="false" placeholder="Mỗi dòng là một cảnh chữ"></textarea>
      <small>Mỗi dòng là một cảnh · dùng <b>|</b> để xuống dòng trong cùng cảnh · khi trình diễn, <b>nhấn giữ màn hình 3 giây</b> để thoát</small>
    </div>

    <div class="controls">
      <button id="showBtn" class="primary">Trình diễn ✨</button>
      <button id="styleBtn">Chữ: Que pháo bông ✨</button>
      <button id="burstBtn">Bắn loạt 🎆</button>
      <button id="autoBtn" class="active">Tự động: BẬT</button>
      <button id="soundBtn" class="active">🔊 Âm thanh</button>
    </div>
  </div>

  <script>
// ===== Default texts for the show (used when the input is empty; "\n" = new line) =====
const SHOW_TEXTS = [
  "Bé Tí của anh ❤️🥰",
  "Cục cưng 💕\nđáng yêu nhất! 😘",
  "Cục vàng ✨\nquý giá của anh! 💎",
  // "Bé Tí 🌷\nlà ngoại lệ duy nhất của anh! 💗",
  "YÊU BÉ TÍ 💖\nNHẤT TRÊN ĐỜI! 🥰💋"
];
// Thin monoline handwriting, like a sparkler trail (supports Vietnamese).
// Fallback is sans-serif (Roboto on Android has full Vietnamese), never "cursive".
const SPARK_FONT = "'Mali', sans-serif";
const SPARK_WEIGHT = 200;
const SALVO_COUNT = 12; // shells in the barrage fired before each text (kept low so phones stay smooth)
const SALVO_DURATION_MS = 2000; // the whole barrage is fired within this time
const SALVO_DELAY_MS = 1800; // wait after the barrage starts before the text shells go up
const SHOW_BG_INTERVAL_MS = 650; // background fireworks during the show (lower = denser)
const BURST_COUNT = 8; // shells fired by the "Bắn loạt" button
const PARTICLE_BUDGET = 2500; // above this, new explosions get fewer sparks to avoid lag
const EXIT_HOLD_MS = 3000; // hold the screen this long to leave the show
const TEXT_HOLD_FRAMES = 150; // how long the finished text keeps burning (~2.5s at 60fps)

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = "round"; // context state resets on resize
}
window.addEventListener("resize", resize);
resize();

const rand = (min, max) => Math.random() * (max - min) + min;
const GRAVITY = 0.04;

const rockets = [];
const particles = [];
let autoLaunch = true;
let frame = 0;

// ===== Sound (synthesized with Web Audio, no audio files needed) =====
const MASTER_VOLUME = 0.8;
let audioCtx = null;
let masterGain = null;
let reverb = null;
let noiseBuffer = null;
let crackleBuffer = null;
let shaperCurve = null;
let soundOn = true;

// Browsers only allow audio after a user gesture, so this runs on the first click/tap
function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === "suspended") audioCtx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  const sr = audioCtx.sampleRate;

  masterGain = audioCtx.createGain();
  masterGain.gain.value = soundOn ? MASTER_VOLUME : 0;
  const comp = audioCtx.createDynamicsCompressor(); // keeps many bursts together from clipping
  comp.threshold.value = -14;
  comp.ratio.value = 6;
  comp.attack.value = 0.003;
  comp.release.value = 0.25;
  masterGain.connect(comp);
  comp.connect(audioCtx.destination);

  // Reverb: synthetic impulse response of an open city sky — a long, darkening, rolling tail
  reverb = audioCtx.createConvolver();
  const irLen = Math.floor(sr * 3.5);
  const ir = audioCtx.createBuffer(2, irLen, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < irLen; i++) {
      const tt = i / irLen;
      const alpha = 0.85 - tt * 0.8; // one-pole low-pass that gets darker over time
      lp += (Math.random() * 2 - 1 - lp) * alpha;
      d[i] = lp * Math.pow(1 - tt, 3);
    }
    // Discrete echoes bouncing off buildings
    for (let k = 0; k < 6; k++) {
      const pos = Math.floor(rand(0.08, 0.9) * sr);
      const amp = rand(0.3, 0.8) * (1 - pos / irLen);
      for (let j = 0; j < 300; j++) d[pos + j] += (Math.random() * 2 - 1) * amp * (1 - j / 300);
    }
  }
  reverb.buffer = ir;
  reverb.connect(masterGain);

  // White noise
  noiseBuffer = audioCtx.createBuffer(1, sr * 3, sr);
  const n = noiseBuffer.getChannelData(0);
  for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1;

  // Crackle: hundreds of tiny sharp pops, dense at first then thinning out
  crackleBuffer = audioCtx.createBuffer(1, Math.floor(sr * 2.5), sr);
  const c = crackleBuffer.getChannelData(0);
  for (let k = 0; k < 450; k++) {
    const tpos = 0.05 + Math.pow(Math.random(), 1.3) * 1.9;
    const pos = Math.floor(tpos * sr);
    const amp = rand(0.2, 1) * (1 - tpos / 2.5);
    const len = Math.floor(rand(15, 90));
    for (let i = 0; i < len; i++) c[pos + i] += (Math.random() * 2 - 1) * amp * Math.exp(-i / (len * 0.25));
  }
}

const canPlay = () => soundOn && audioCtx && audioCtx.state === "running";

// Output chain: volume -> (dry + reverb send) -> stereo position from screen x
function soundOut(x, vol, wet) {
  const g = audioCtx.createGain();
  g.gain.value = vol;
  const dry = audioCtx.createGain();
  dry.gain.value = 1 - wet * 0.5;
  const send = audioCtx.createGain();
  send.gain.value = wet;
  g.connect(dry);
  g.connect(send);
  send.connect(reverb);
  if (audioCtx.createStereoPanner) {
    const p = audioCtx.createStereoPanner();
    p.pan.value = Math.max(-1, Math.min(1, (x / W) * 1.6 - 0.8));
    dry.connect(p);
    p.connect(masterGain);
  } else {
    dry.connect(masterGain);
  }
  return g;
}

// Soft clipper: gives the blast its punch
function shaper() {
  if (!shaperCurve) {
    shaperCurve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) shaperCurve[i] = Math.tanh(((i / 1023) * 2 - 1) * 2.5);
  }
  const s = audioCtx.createWaveShaper();
  s.curve = shaperCurve;
  return s;
}

function noiseSrc(t, dur) {
  const s = audioCtx.createBufferSource();
  s.buffer = noiseBuffer;
  s.start(t, rand(0, 3 - dur > 0 ? 3 - dur : 0));
  s.stop(t + dur);
  return s;
}

function envGain(t, peak, attack, decay) {
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  return g;
}

function biquad(type, freq, q = 0.7) {
  const f = audioCtx.createBiquadFilter();
  f.type = type;
  f.frequency.value = freq;
  f.Q.value = q;
  return f;
}

// Chain nodes left to right
const chain = (...nodes) => nodes.reduce((a, b) => (a.connect(b), b));

function playLaunch(x) {
  if (!canPlay()) return;
  const t = audioCtx.currentTime;
  const out = soundOut(x, 0.45, 0.35);

  // Mortar thump (lift charge)
  const o = audioCtx.createOscillator();
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  chain(o, envGain(t, 0.8, 0.003, 0.18), out);
  o.start(t);
  o.stop(t + 0.25);
  chain(noiseSrc(t, 0.15), biquad("lowpass", 900), envGain(t, 0.6, 0.002, 0.1), out);

  // Hiss of the rising shell
  const dur = rand(0.7, 1);
  const bp = biquad("bandpass", 1500, 0.8);
  bp.frequency.setValueAtTime(1500, t);
  bp.frequency.exponentialRampToValueAtTime(4000, t + dur);
  chain(noiseSrc(t + 0.03, dur), bp, envGain(t + 0.03, 0.06, 0.08, dur), out);

  // Some shells whistle on the way up
  if (Math.random() < 0.25) {
    const w = audioCtx.createOscillator();
    w.frequency.setValueAtTime(rand(800, 1100), t + 0.05);
    w.frequency.exponentialRampToValueAtTime(rand(2200, 3000), t + dur * 1.1);
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = rand(20, 35);
    const lfoAmt = audioCtx.createGain();
    lfoAmt.gain.value = 40;
    chain(lfo, lfoAmt, w.frequency);
    chain(w, envGain(t + 0.05, 0.05, 0.1, dur), out);
    w.start(t + 0.05);
    lfo.start(t + 0.05);
    w.stop(t + dur * 1.2);
    lfo.stop(t + dur * 1.2);
  }
}

function playBoom(x, size = 1) {
  if (!canPlay()) return;
  const dist = rand(0.15, 1); // perceived distance: far = darker, later, more reverb
  const t = audioCtx.currentTime + 0.04 + dist * 0.3;
  const out = soundOut(x, size * (1.1 - dist * 0.45), 0.35 + dist * 0.45);
  const bright = 5000 - dist * 3500;
  const clip = shaper();
  clip.connect(out);

  // 1. Sharp crack — the initial bang
  chain(noiseSrc(t, 0.12), biquad("lowpass", bright), envGain(t, 1.6, 0.001, 0.07), clip);

  // 2. Body — dark booming rumble
  const lp = biquad("lowpass", bright * 0.35);
  lp.frequency.setValueAtTime(bright * 0.35, t);
  lp.frequency.exponentialRampToValueAtTime(70, t + 2);
  chain(noiseSrc(t, 2.6), lp, envGain(t, 1, 0.004, rand(1.6, 2.4)), clip);

  // 3. Sub-bass punch
  const o = audioCtx.createOscillator();
  o.frequency.setValueAtTime(rand(60, 75), t);
  o.frequency.exponentialRampToValueAtTime(30, t + 0.4);
  chain(o, envGain(t, 1.2, 0.002, 0.8), clip);
  o.start(t);
  o.stop(t + 0.9);

  // 4. Crackle (glitter shells only)
  if (Math.random() < 0.45) {
    const cr = audioCtx.createBufferSource();
    cr.buffer = crackleBuffer;
    cr.playbackRate.value = rand(0.85, 1.2);
    const cg = audioCtx.createGain();
    cg.gain.value = rand(0.25, 0.5);
    chain(cr, biquad("highpass", 700), cg, out);
    cr.start(t + rand(0.25, 0.5));
  }
}

// Continuous sizzle of a sparkler while the text is written and burning
function playSparkler(dur, fade) {
  if (!canPlay()) return;
  const t = audioCtx.currentTime;
  const out = soundOut(W / 2, 0.35, 0.25);
  const env = audioCtx.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(1, t + 0.15);
  env.gain.setValueAtTime(1, t + dur);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur + fade);
  env.connect(out);

  // Hiss
  const n = audioCtx.createBufferSource();
  n.buffer = noiseBuffer;
  n.loop = true;
  const ng = audioCtx.createGain();
  ng.gain.value = 0.25;
  chain(n, biquad("highpass", 4000), ng, env);

  // Fizzing crackle
  const c = audioCtx.createBufferSource();
  c.buffer = crackleBuffer;
  c.loop = true;
  c.playbackRate.value = 2.2;
  const cg = audioCtx.createGain();
  cg.gain.value = 0.6;
  chain(c, biquad("highpass", 2000), cg, env);

  const end = t + dur + fade + 0.1;
  n.start(t);
  c.start(t);
  n.stop(end);
  c.stop(end);
}

// Rocket: flies from the bottom to a target point, then explodes
class Rocket {
  constructor(x, targetX, targetY, onExplode = null) {
    this.onExplode = onExplode;
    this.x = x;
    this.y = H;
    this.tx = targetX;
    this.ty = targetY;
    const dist = Math.hypot(targetX - x, targetY - H);
    const speed = rand(9, 12);
    this.vx = ((targetX - x) / dist) * speed;
    this.vy = ((targetY - H) / dist) * speed;
    this.hue = rand(0, 360);
    this.trail = [];
    playLaunch(x);
  }

  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 6) this.trail.shift();

    this.x += this.vx;
    this.y += this.vy;
    this.vy += GRAVITY * 0.3;

    // Ordinary shells fly "dark" (no tail at all) while crossing the text, so it stays clean.
    // Text shells (onExplode) are the ones forming the text and stay visible.
    this.hidden = !this.onExplode && insideText(this.x, this.y);
    if (this.hidden) this.trail.length = 0;

    // Spark trail
    if (!this.hidden && Math.random() < 0.5) {
      particles.push(new Particle(this.x, this.y, rand(-0.5, 0.5), rand(0.5, 1.5), 40, 0.6, 0.03, 1.2));
    }

    return this.y <= this.ty || this.vy >= 0;
  }

  draw() {
    if (this.hidden) return;
    ctx.globalAlpha = 1;
    ctx.beginPath();
    const first = this.trail[0] || this;
    ctx.moveTo(first.x, first.y);
    ctx.lineTo(this.x, this.y);
    ctx.strokeStyle = `hsl(${this.hue}, 100%, 75%)`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// Particle: one spark of an explosion
class Particle {
  constructor(x, y, vx, vy, hue, alphaStart = 1, decay = rand(0.012, 0.022), size = rand(1.5, 2.8)) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.hue = hue;
    this.alpha = alphaStart;
    this.decay = decay;
    this.size = size;
    this.friction = 0.97;
    this.flicker = Math.random() < 0.3;
  }

  update() {
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += GRAVITY;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
    return this.alpha <= 0;
  }

  draw() {
    const a = this.flicker ? this.alpha * rand(0.4, 1) : this.alpha;
    ctx.globalAlpha = Math.max(a, 0);
    ctx.fillStyle = `hsl(${this.hue}, 100%, ${rand(55, 75)}%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Tiny golden glitter that drips from sparks
function glitter(x, y) {
  particles.push(
    new Particle(x, y, rand(-0.25, 0.25), rand(0, 0.5), rand(35, 50), 0.85, rand(0.02, 0.035), rand(0.5, 1)),
  );
}

// Explosion shapes
// Fewer sparks per explosion when the sky is already crowded (keeps frame rate steady)
const budget = (n) => Math.round(n * Math.max(0.3, Math.min(1, 1.15 - particles.length / PARTICLE_BUDGET)));

const shapes = {
  sphere(x, y, hue) {
    const count = budget(120);
    for (let i = 0; i < count; i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(1, 7);
      particles.push(
        new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, hue + rand(-20, 20)),
      );
    }
  },

  ring(x, y, hue) {
    const count = budget(90);
    const speed = rand(5, 6.5);
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, hue));
    }
    shapes.sphere(x, y, (hue + 180) % 360);
  },

  heart(x, y) {
    const count = budget(110);
    for (let i = 0; i < count; i++) {
      const t = (i / count) * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      particles.push(new Particle(x, y, hx * 0.35, hy * 0.35, 340 + rand(-10, 10)));
    }
  },

  star(x, y, hue) {
    const points = 5;
    const count = budget(150);
    for (let i = 0; i < count; i++) {
      const t = (i / count) * Math.PI * 2;
      const r = 4 + 3 * Math.cos(points * t);
      particles.push(new Particle(x, y, Math.cos(t) * r, Math.sin(t) * r, hue + rand(-10, 10)));
    }
  },

  multicolor(x, y) {
    const count = budget(140);
    for (let i = 0; i < count; i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(1, 7.5);
      particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, rand(0, 360)));
    }
  },
};

const shapeKeys = Object.keys(shapes);
const weights = { sphere: 4, ring: 2, heart: 1, star: 1, multicolor: 2 };
function pickShape() {
  const total = shapeKeys.reduce((s, k) => s + weights[k], 0);
  let r = Math.random() * total;
  for (const k of shapeKeys) {
    r -= weights[k];
    if (r <= 0) return k;
  }
  return "sphere";
}

let flash = 0;
function explode(x, y, hue) {
  shapes[pickShape()](x, y, hue);
  flash = 0.12;
}

// ===== Visible-time timers =====
// A hidden tab stops drawing (requestAnimationFrame) but keeps running setTimeout/setInterval.
// Ordinary timers would queue up hundreds of shells and fire them all at once on return,
// so every show timer counts only the time the page is actually visible.
let visibleMs = 0;
let lastClock = performance.now();
function visibleClock() {
  const now = performance.now();
  if (!document.hidden) visibleMs += now - lastClock;
  lastClock = now;
  return visibleMs;
}
document.addEventListener("visibilitychange", () => {
  // Fires after the state flips: if we are hidden now, the segment that just ended was visible
  const now = performance.now();
  if (document.hidden) visibleMs += now - lastClock;
  lastClock = now;
});

function sleep(ms) {
  return new Promise((resolve) => {
    const target = visibleClock() + ms;
    (function tick() {
      const left = target - visibleClock();
      if (left <= 0) resolve();
      else setTimeout(tick, Math.min(left, 100));
    })();
  });
}

function later(fn, ms) {
  sleep(ms).then(fn);
}

const MAX_ROCKETS = 60; // hard safety cap for ordinary shells

function launch(targetX, targetY) {
  if (document.hidden || rockets.length > MAX_ROCKETS) return;
  const startX = targetX + rand(-W * 0.1, W * 0.1);
  rockets.push(new Rocket(startX, targetX, targetY));
}

function randomLaunch() {
  launch(rand(W * 0.15, W * 0.85), rand(H * 0.12, H * 0.45));
}

// ===== Text show: sparkler light-painting style (handwritten glowing strokes) =====
const writings = [];

// Short spiky spark that shoots out of a sparkler stroke, sometimes forking at the tip
class SparkSpike {
  constructor(x, y, len) {
    this.x = x;
    this.y = y;
    const a = rand(0, Math.PI * 2);
    this.dx = Math.cos(a);
    this.dy = Math.sin(a);
    this.len = len;
    this.life = Math.floor(rand(2, 6));
    this.age = 0;
    this.color = `rgb(255, ${Math.round(rand(175, 235))}, ${Math.round(rand(110, 185))})`;
    this.forks =
      len > 9 && Math.random() < 0.6
        ? [a + rand(0.3, 0.9), a - rand(0.3, 0.9)].concat(Math.random() < 0.4 ? [a + rand(-0.2, 0.2)] : [])
        : null;
  }

  update() {
    this.age++;
    return this.age > this.life;
  }

  draw() {
    const t = this.age / this.life;
    const L = this.len * (0.45 + 0.55 * t); // spike shoots outward
    const ex = this.x + this.dx * L;
    const ey = this.y + this.dy * L;
    ctx.globalAlpha = 1 - t * 0.7;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(ex, ey);
    if (this.forks && t > 0.3) {
      const fl = this.len * 0.35;
      for (const fa of this.forks) {
        ctx.moveTo(ex, ey);
        ctx.lineTo(ex + Math.cos(fa) * fl, ey + Math.sin(fa) * fl);
      }
    }
    ctx.stroke();
  }
}

// Is this point over a text that is currently on screen (or forming)?
function insideText(x, y) {
  for (const w of writings) {
    const r = w.layer.rect;
    if (x > r.x0 && x < r.x1 && y > r.y0 && y < r.y1) return true;
  }
  return false;
}

// Pre-render the glowing handwritten text once, and sample stroke points for sparks
function buildTextLayer(text, withGlow = true) {
  const m = document.createElement("canvas").getContext("2d");

  // Wrap long lines at word boundaries so the text never has to shrink below a readable
  // size (on a narrow phone a whole sentence on one line becomes unreadable dots)
  const minSize = Math.min(72, Math.max(44, W * 0.16));
  m.font = `${SPARK_WEIGHT} ${minSize}px ${SPARK_FONT}`;
  const lines = [];
  for (const raw of text.split("\n")) {
    let cur = "";
    for (const word of raw.split(/\s+/).filter(Boolean)) {
      const next = cur ? cur + " " + word : word;
      if (cur && m.measureText(next).width > W * 0.85) {
        lines.push(cur);
        cur = word;
      } else cur = next;
    }
    lines.push(cur);
  }

  // Measure + fit size
  let size = Math.min((H * 0.55) / lines.length, 260);
  m.font = `${SPARK_WEIGHT} ${size}px ${SPARK_FONT}`;
  const widest = Math.max(...lines.map((l) => m.measureText(l).width));
  if (widest > W * 0.85) size *= (W * 0.85) / widest;
  const font = `${SPARK_WEIGHT} ${size}px ${SPARK_FONT}`;
  m.font = font;

  const lineH = size * 1.1;
  const top = H * 0.42 - ((lines.length - 1) * lineH) / 2;
  const boxes = lines.map((l, i) => {
    const w = m.measureText(l).width;
    return {
      text: l,
      y: top + i * lineH,
      x0: W / 2 - w / 2 - size * 0.1,
      x1: W / 2 + w / 2 + size * 0.1,
      h: lineH * 1.3,
    };
  });

  // Horizontal span of every character (used by the burst style: one shell per character).
  // Split by grapheme so a letter and its accents always stay together.
  const seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter() : null;
  const chars = [];
  boxes.forEach((b) => {
    const start = W / 2 - m.measureText(b.text).width / 2;
    const parts = seg ? [...seg.segment(b.text)].map((s) => s.segment) : Array.from(b.text);
    let pos = 0;
    for (const part of parts) {
      const x0 = start + m.measureText(b.text.slice(0, pos)).width;
      pos += part.length;
      const x1 = start + m.measureText(b.text.slice(0, pos)).width;
      if (part.trim()) chars.push({ y: b.y, x0, x1, emoji: EMOJI_RE.test(part), text: part, font });
    }
  });

  // 1) Sample stroke points (1x resolution is enough)
  const sc = document.createElement("canvas");
  sc.width = W;
  sc.height = H;
  const s = sc.getContext("2d", { willReadFrequently: true });
  s.font = font;
  s.textAlign = "center";
  s.textBaseline = "middle";
  s.fillStyle = "#fff";
  boxes.forEach((b) => s.fillText(b.text, W / 2, b.y));
  const data = s.getImageData(0, 0, W, H).data;
  const pts = [];
  for (let y = 0; y < H; y += 3) {
    for (let x = 0; x < W; x += 3) {
      const i = (y * W + x) * 4;
      // Keep the source colour: text is white, but colour emoji keep their own colours
      if (data[i + 3] > 128) pts.push({ x, y, r: data[i], g: data[i + 1], b: data[i + 2] });
    }
  }

  // 2) Glow layer at device resolution (only the sparkler style needs it)
  const gc = withGlow ? document.createElement("canvas") : null;
  if (gc) {
    gc.width = W * dpr;
    gc.height = H * dpr;
    const g = gc.getContext("2d");
    g.scale(dpr, dpr);
    g.font = font;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.lineJoin = "round";
    const each = (fn) => boxes.forEach((b) => fn(b.text, W / 2, b.y));

    // Warm orange halo around the strokes
    g.save();
    g.shadowColor = "rgba(255, 120, 20, 0.9)";
    g.shadowBlur = size * 0.12;
    g.fillStyle = "rgba(255, 140, 50, 0.4)";
    each((t, x, y) => g.fillText(t, x, y));
    g.restore();

    // Long-exposure strands: the hand traces each letter several times, never exactly on
    // the same path — slight shift/rotation/scale per strand leaves thin separate light trails
    const cy = boxes.reduce((s, b) => s + b.y, 0) / boxes.length;
    for (let k = 0; k < 4; k++) {
      g.save();
      g.translate(W / 2, cy);
      g.rotate(rand(-0.012, 0.012));
      g.scale(1 + rand(-0.012, 0.012), 1 + rand(-0.02, 0.02));
      g.translate(-W / 2 + rand(-size / 45, size / 45), -cy + rand(-size / 45, size / 45));
      g.shadowColor = "rgba(255, 170, 80, 1)";
      g.shadowBlur = 4;
      const core = k === 0;
      g.fillStyle = core
        ? "rgba(255, 246, 225, 0.95)"
        : `rgba(255, ${Math.round(rand(200, 225))}, ${Math.round(rand(140, 180))}, 0.75)`;
      each((t, x, y) => g.fillText(t, x, y));
      g.restore();
    }

    // Emoji: the shifted strands above would blur them into a mess, so wipe their boxes
    // and draw each emoji once, crisp, with a soft warm sparkler halo around it
    g.save();
    g.textAlign = "left";
    for (const ch of chars) {
      if (!ch.emoji) continue;
      g.clearRect(ch.x0 - 2, ch.y - size * 0.62, ch.x1 - ch.x0 + 4, size * 1.24);
      g.shadowColor = "rgba(255, 150, 60, 0.9)";
      g.shadowBlur = size * 0.15;
      g.fillText(ch.text, ch.x0, ch.y);
      g.shadowBlur = 0;
      g.fillText(ch.text, ch.x0, ch.y);
    }
    g.restore();
  }

  // Sparks come from the letter strokes; emoji pixels (coloured, not white) only rarely
  // spark from their edge, so the sparks never cover the emoji's details
  const sparkPts = pts.filter((p) => Math.max(p.r, p.g, p.b) - Math.min(p.r, p.g, p.b) < 40);
  const emojiPts = pts.filter((p) => Math.max(p.r, p.g, p.b) - Math.min(p.r, p.g, p.b) >= 40);
  for (let i = 0; i < emojiPts.length; i += 25) sparkPts.push(emojiPts[i]);

  // Bounding box of the text (padded to cover glow + sparks), used to keep rocket trails off it
  const pad = 45;
  let x0 = Infinity,
    y0 = Infinity,
    x1 = -Infinity,
    y1 = -Infinity;
  for (const p of pts) {
    if (p.x < x0) x0 = p.x;
    if (p.x > x1) x1 = p.x;
    if (p.y < y0) y0 = p.y;
    if (p.y > y1) y1 = p.y;
  }
  const rect = { x0: x0 - pad, y0: y0 - pad, x1: x1 + pad, y1: y1 + pad };

  return { canvas: gc, pts, sparkPts, rect, size, chars, lineH };
}

// A spark from a shell burst that flies into place on the text, then fades as the text ignites
class FlyingSpark {
  constructor(x, y, tx, ty, writing) {
    this.x = this.px = x;
    this.y = this.py = y;
    this.tx = tx;
    this.ty = ty;
    this.w = writing;
    const a = rand(0, Math.PI * 2);
    const s = rand(1.5, 6.5);
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s;
    this.age = 0;
    this.burstFrames = rand(8, 20);
    this.k = 0; // spring strength, ramps up so the pull feels gradual
    this.alpha = 1;
    this.size = rand(1, 1.8);
    this.color = `rgb(255, ${Math.round(rand(215, 245))}, ${Math.round(rand(160, 215))})`;
  }

  update() {
    this.px = this.x;
    this.py = this.y;
    this.age++;
    if (this.age < this.burstFrames) {
      // Outward burst like a real shell
      this.vx *= 0.9;
      this.vy = this.vy * 0.9 + 0.02;
    } else {
      // Pulled into place by a damped spring
      this.k = Math.min(this.k + 0.0015, 0.04);
      this.vx = (this.vx + (this.tx - this.x) * this.k) * 0.86;
      this.vy = (this.vy + (this.ty - this.y) * this.k) * 0.86;
    }
    this.x += this.vx;
    this.y += this.vy;
    if (Math.random() < 0.03) glitter(this.x, this.y);
    // Hand over to the glowing text once it ignites
    const f = this.w.formFrame;
    if (f !== null && frame > f + 8) this.alpha -= 0.06;
    return this.alpha <= 0;
  }

  draw() {
    const a = Math.max(this.alpha, 0);
    ctx.globalAlpha = a;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.size;
    ctx.beginPath();
    ctx.moveTo(this.px, this.py);
    ctx.lineTo(this.x + 0.01, this.y);
    ctx.stroke();
    ctx.globalAlpha = a * 0.15;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Sparkler-style text that appears all at once when the shells' sparks arrive
class SparklerWriting {
  constructor(text) {
    this.layer = buildTextLayer(text);
    this.formFrame = null; // set when shells explode; text ignites at this frame
    this.igniteFrames = 25;
    this.holdFrames = TEXT_HOLD_FRAMES;
    this.fadeFrames = 70;
    this.soundStarted = false;
  }

  // 0 before ignition, ramps to 1, holds, then falls to 0 while fading out
  intensity() {
    if (this.formFrame === null || frame < this.formFrame) return 0;
    const t = frame - this.formFrame;
    if (t < this.igniteFrames) return t / this.igniteFrames;
    const f = t - this.igniteFrames - this.holdFrames;
    return f <= 0 ? 1 : Math.max(0, 1 - f / this.fadeFrames);
  }

  update() {
    const I = this.intensity();
    if (I > 0 && !this.soundStarted) {
      this.soundStarted = true;
      playSparkler((this.igniteFrames + this.holdFrames) / 60, this.fadeFrames / 60);
    }

    // Spiky sparks along the strokes
    const pts = this.layer.sparkPts;
    const n = Math.floor((pts.length / 12) * I);
    for (let k = 0; k < n; k++) {
      const p = pts[(Math.random() * pts.length) | 0];
      const r = Math.random();
      const len = r < 0.1 ? rand(24, 45) : r < 0.5 ? rand(10, 24) : rand(3, 10);
      particles.push(new SparkSpike(p.x, p.y, len));
      if (Math.random() < 0.01 * I) glitter(p.x, p.y);
    }

    return (
      this.formFrame !== null &&
      frame > this.formFrame + this.igniteFrames + this.holdFrames + this.fadeFrames
    );
  }

  draw() {
    const I = this.intensity();
    if (I <= 0) return;
    // Canvas fades 22%/frame, so drawing at ~0.21 alpha settles at full brightness
    ctx.globalAlpha = 0.21 * I * rand(0.85, 1);
    ctx.drawImage(this.layer.canvas, 0, 0, W, H);
  }
}

// Fire several shells; each bursts over its own part of the text and its sparks fly into place.
// Returns roughly how long (ms) the whole text lasts.
function sparklerText(text) {
  const w = new SparklerWriting(text);
  writings.push(w);

  const all = w.layer.pts;
  const step = Math.max(1, Math.ceil(all.length / 700)); // cap flying sparks for performance
  const pts = all.filter((_, i) => i % step === 0).sort((a, b) => a.x - b.x);
  const shellCount = Math.min(6, Math.max(2, Math.ceil(pts.length / 150)));
  const chunk = Math.ceil(pts.length / shellCount);

  for (let i = 0; i < shellCount; i++) {
    const part = pts.slice(i * chunk, (i + 1) * chunk);
    if (!part.length) continue;
    const cx = part.reduce((s, p) => s + p.x, 0) / part.length;
    const cy = part.reduce((s, p) => s + p.y, 0) / part.length;

    later(
      () => {
        rockets.push(
          new Rocket(cx + rand(-40, 40), cx, cy + rand(-25, 25), (x, y) => {
            for (const p of part) particles.push(new FlyingSpark(x, y, p.x, p.y, w));
            for (let n = 0; n < 30; n++) {
              const a = rand(0, Math.PI * 2);
              const s = rand(1, 4);
              particles.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s, 42));
            }
            // Text ignites once the last shell's sparks have arrived
            w.formFrame = frame + 55;
            flash = 0.15;
          }),
        );
      },
      i * rand(90, 140),
    );
  }

  return 1700 + ((55 + w.igniteFrames + w.holdFrames + w.fadeFrames) / 60) * 1000;
}

// ===== Text show: shaped-burst style (like the heart / star shells) =====
// One shell bursts and its stars fly straight out to the letter shapes, stop there,
// twinkle for a while, then droop and burn out like a real shell.
const BURST_EXPAND_FRAMES = 45;
const BURST_HUES = [45, 330, 190, 120, 280, 15, 210];

// Emoji (❤️ 🥰 💋 …) are drawn as many small dots in their own colours instead of one hue,
// otherwise they become unreadable single-colour blobs
const EMOJI_RE = /\p{Extended_Pictographic}/u;

class TextDot {
  constructor(x, y, tx, ty, hue, holdFrames, rgb = null) {
    this.x = this.px = x;
    this.y = this.py = y;
    this.tx = tx;
    this.ty = ty;
    // With friction F the total travel is v / (1 - F), so this lands exactly on the target
    this.F = 0.9;
    this.vx = (tx - x) * (1 - this.F);
    this.vy = (ty - y) * (1 - this.F);
    this.age = 0;
    this.hold = holdFrames + rand(-10, 10);
    this.fade = rand(50, 85);
    this.alpha = 1;
    this.hue = Math.random() < 0.15 ? -1 : hue + rand(-12, 12); // -1 = white sparkle star
    this.rgb = rgb; // emoji dot: fixed colour taken from the emoji itself
    if (rgb) this.size = rand(1, 1.4);
    this.size = rand(1.2, 1.9);
    this.phase = rand(0, Math.PI * 2);
  }

  update() {
    this.px = this.x;
    this.py = this.y;
    this.age++;
    if (this.age <= BURST_EXPAND_FRAMES) {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= this.F;
      this.vy *= this.F;
    } else if (this.age <= BURST_EXPAND_FRAMES + this.hold) {
      this.x += (this.tx - this.x) * 0.2; // settle exactly on the letter
      this.y += (this.ty - this.y) * 0.2;
      this.vx = this.vy = 0;
      if (Math.random() < 0.003) glitter(this.x, this.y);
    } else {
      // Burn out: droop under gravity and fade
      this.vy += 0.035;
      this.x += rand(-0.15, 0.15);
      this.y += this.vy;
      this.alpha -= 1 / this.fade;
      if (Math.random() < 0.01) glitter(this.x, this.y);
    }
    return this.alpha <= 0;
  }

  draw() {
    // White-hot right after the burst, cooling to its colour
    const light = this.age < 18 ? 95 - this.age * 1.6 : 66;
    const color = this.rgb
      ? this.age < 10
        ? "#fff"
        : this.rgb
      : this.hue < 0
        ? `hsl(45, 100%, ${Math.max(light, 88)}%)`
        : `hsl(${this.hue}, 100%, ${light}%)`;
    const tw = this.age > BURST_EXPAND_FRAMES ? 0.65 + 0.35 * Math.sin(this.age * 0.35 + this.phase) : 1;
    const a = Math.max(this.alpha, 0) * tw;

    ctx.globalAlpha = a;
    ctx.strokeStyle = color;
    ctx.lineWidth = this.size;
    ctx.beginPath();
    ctx.moveTo(this.px, this.py);
    ctx.lineTo(this.x + 0.01, this.y);
    ctx.stroke();
    ctx.globalAlpha = a * (this.rgb ? 0.08 : 0.18); // softer halo keeps emoji details apart
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 2.8, 0, Math.PI * 2);
    ctx.fill();
  }
}

// The real emoji glyph fades in where its dots have landed, so small details (eyes, mouth,
// tiny hearts) stay recognisable, then burns out together with the dots
class EmojiGlyph {
  constructor(ch, holdFrames) {
    this.ch = ch;
    this.hold = holdFrames;
    this.age = 0;
  }

  update() {
    this.age++;
    return this.age > BURST_EXPAND_FRAMES + this.hold + 70;
  }

  draw() {
    const t = this.age - (BURST_EXPAND_FRAMES - 15);
    const end = BURST_EXPAND_FRAMES + this.hold;
    let k = Math.min(1, Math.max(0, t / 30)); // fade in as the dots settle
    if (this.age > end) k *= Math.max(0, 1 - (this.age - end) / 60); // burn out with the dots
    if (k <= 0) return;
    // Canvas fades 22%/frame, so ~0.2 alpha per frame settles at full brightness
    ctx.globalAlpha = 0.2 * k * rand(0.9, 1);
    ctx.font = this.ch.font;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(this.ch.text, this.ch.x0, this.ch.y);
  }
}

// Evenly spaced dots along the letters (shuffled greedy spacing, so it looks natural)
function spacedPoints(pts, d, maxCount) {
  for (;;) {
    const cells = new Map();
    const out = [];
    const order = pts.slice().sort(() => Math.random() - 0.5);
    for (const p of order) {
      const cx = Math.floor(p.x / d);
      const cy = Math.floor(p.y / d);
      let ok = true;
      for (let i = -1; i <= 1 && ok; i++) {
        for (let j = -1; j <= 1 && ok; j++) {
          const q = cells.get((cx + i) * 100000 + (cy + j));
          if (q && (q.x - p.x) ** 2 + (q.y - p.y) ** 2 < d * d) ok = false;
        }
      }
      if (ok) {
        cells.set(cx * 100000 + cy, p);
        out.push(p);
      }
    }
    if (out.length <= maxCount) return out;
    d *= Math.sqrt(out.length / maxCount);
  }
}

function burstText(text) {
  const layer = buildTextLayer(text, false);
  const hold = TEXT_HOLD_FRAMES;
  const w = { layer, end: Infinity, update: () => frame > w.end, draw() {} };
  writings.push(w);

  // Give every sampled pixel to the character it belongs to (same line, nearest horizontal span)
  const words = layer.chars.map((wd) => ({ ...wd, pts: [] }));
  for (const p of layer.pts) {
    let best = null;
    let bestD = Infinity;
    for (const wd of words) {
      const dx = p.x < wd.x0 ? wd.x0 - p.x : p.x > wd.x1 ? p.x - wd.x1 : 0;
      const d = dx + Math.abs(p.y - wd.y) * 3; // strongly prefer the dot's own line
      if (d < bestD) {
        bestD = d;
        best = wd;
      }
    }
    if (best) best.pts.push(p);
  }

  // Thin out to dots: letters get a light dotted line, emoji get dense dots in their own colours.
  // Dark emoji pixels (eyes, mouth, outlines) are left out so they show as gaps.
  const textGap = Math.max(3, Math.min(10, layer.size / 18));
  const dotScale = Math.max(0.55, Math.min(1, layer.size / 110)); // smaller dots for small text
  const emojiGap = Math.max(3, Math.min(6, layer.size / 34));
  for (const wd of words) {
    if (wd.emoji) {
      const lit = wd.pts.filter((p) => Math.max(p.r, p.g, p.b) > 80);
      wd.pts = spacedPoints(lit, emojiGap, 320);
    } else {
      wd.pts = spacedPoints(wd.pts, textGap, 120);
    }
  }
  const shells = words.filter((wd) => wd.pts.length);

  // One shell per character, fired one after another, each its own colour.
  // Earlier characters hold longer so the whole text burns out together.
  // Short gap for long texts so the whole line still forms within ~2 s.
  const GAP_MS = Math.max(70, Math.min(160, 2000 / Math.max(1, layer.chars.length)));
  const hue0 = (Math.random() * BURST_HUES.length) | 0;
  let exploded = 0;
  shells.forEach((wd, i) => {
    const hue = BURST_HUES[(hue0 + i) % BURST_HUES.length];
    const wordHold = hold + Math.round(((shells.length - 1 - i) * GAP_MS * 60) / 1000);
    const cx = wd.pts.reduce((s, p) => s + p.x, 0) / wd.pts.length;
    const cy = wd.pts.reduce((s, p) => s + p.y, 0) / wd.pts.length;
    later(() => {
      if (!writings.includes(w)) return; // show was stopped
      rockets.push(
        new Rocket(cx + rand(-25, 25), cx, cy, (x, y) => {
          if (wd.emoji) particles.push(new EmojiGlyph(wd, wordHold));
          for (const p of wd.pts) {
            const rgb = wd.emoji ? `rgb(${p.r}, ${p.g}, ${p.b})` : null;
            const dot = new TextDot(x, y, p.x, p.y, hue, wordHold, rgb);
            dot.size *= dotScale;
            particles.push(dot);
          }
          // A loose scatter of ordinary stars around it, like the outer shell of a real burst
          for (let n = 0; n < 10; n++) {
            const a = rand(0, Math.PI * 2);
            const s = rand(2, 6);
            particles.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s, hue + rand(-20, 20)));
          }
          flash = 0.18;
          if (++exploded === shells.length) w.end = frame + BURST_EXPAND_FRAMES + hold + 90;
        }),
      );
    }, i * GAP_MS);
  });
  if (!shells.length) w.end = frame;

  return 1700 + (shells.length - 1) * GAP_MS + ((BURST_EXPAND_FRAMES + hold + 85) / 60) * 1000;
}

// Text style: "burst" (shaped shell, like heart/star) or "sparkler" (light-painting)
// Default is "sparkler". New storage key so a choice saved under the old default is not reused.
const STYLE_STORAGE_KEY = "fireworks-text-style-v2";
let textStyle = "sparkler";
try {
  if (localStorage.getItem(STYLE_STORAGE_KEY) === "burst") textStyle = "burst";
} catch (e) {}

function writeText(text) {
  return textStyle === "burst" ? burstText(text) : sparklerText(text);
}


// A dense barrage: shells cover the whole sky evenly, fired in random order within the duration
function salvo(count, durationMs = SALVO_DURATION_MS) {
  const xs = [];
  for (let i = 0; i < count; i++) xs.push(W * (0.06 + (0.88 * (i + rand(0.15, 0.85))) / count));
  xs.sort(() => Math.random() - 0.5);
  xs.forEach((x, i) => {
    later(() => launch(x, rand(H * 0.08, H * 0.5)), (i / count) * durationMs + rand(0, 60));
  });
}

// Continuous background fireworks while the text is shown: top band and side edges only,
// so the text in the middle stays readable
function backgroundLaunch() {
  if (document.hidden || rockets.length > MAX_ROCKETS) return; // never queue shells in a hidden tab
  let x, y;
  // Pick a burst point that is not over the text (retry a few times)
  for (let tries = 0; tries < 8; tries++) {
    const r = Math.random();
    if (r < 0.5) {
      x = rand(W * 0.1, W * 0.9);
      y = rand(H * 0.04, H * 0.16);
    } else {
      x = r < 0.75 ? rand(W * 0.02, W * 0.14) : rand(W * 0.86, W * 0.98);
      y = rand(H * 0.1, H * 0.6);
    }
    if (!insideText(x, y)) break;
    if (tries === 7) return; // no free spot right now, skip this one
  }
  rockets.push(new Rocket(x + rand(-W * 0.04, W * 0.04), x, y));
}
// ===== Show mode =====
let showRunning = false;
let showId = 0; // lets an old show loop notice it has been stopped
let bgTimer = null;
let autoBeforeShow = true;

// Texts from the input: one scene per line, "|" breaks a line inside a scene
function getShowTexts() {
  const texts = textInput.value
    // Some Android keyboards type Vietnamese as base letter + separate combining marks;
    // NFC turns them into precomposed letters so the accents render correctly
    .normalize("NFC")
    .split("\n")
    .map((l) => l.trim())
    .filter(Boolean)
    .map((l) =>
      l
        .split("|")
        .map((s) => s.trim())
        .join("\n"),
    );
  return texts.length ? texts : SHOW_TEXTS;
}

async function runShow() {
  if (showRunning) return;
  const texts = getShowTexts();
  showRunning = true;
  const id = ++showId;
  const alive = () => showRunning && showId === id;

  autoBeforeShow = autoLaunch;
  setAuto(false);
  initAudio();
  textInput.blur();
  enterFullscreen(); // must run inside the click, before any await
  document.body.classList.add("show");

  // Make sure the handwriting font is ready before drawing to canvas
  try {
    await document.fonts.load(`${SPARK_WEIGHT} 100px ${SPARK_FONT}`, texts.join(""));
  } catch (e) {}
  if (!alive()) return;

  // Background fireworks never stop during the show
  bgTimer = setInterval(backgroundLaunch, SHOW_BG_INTERVAL_MS);

  // Loop the texts until the viewer holds the screen to exit
  while (alive()) {
    for (const text of texts) {
      // Dense opening barrage across the whole sky, then the text shells
      salvo(SALVO_COUNT);
      await sleep(SALVO_DELAY_MS);
      if (!alive()) return;
      const ms = writeText(text);
      await sleep(ms + 300);
      if (!alive()) return;
    }
    // Big barrage between rounds
    salvo(SALVO_COUNT, SALVO_DURATION_MS * 1.5);
    await sleep(3500);
  }
}

function stopShow() {
  if (!showRunning) return;
  showRunning = false;
  clearInterval(bgTimer);
  writings.length = 0;
  document.body.classList.remove("show");
  exitFullscreen();
  setAuto(autoBeforeShow);
}

function enterFullscreen() {
  // Without a user gesture (e.g. auto-start on load) the browser would only refuse it
  if (navigator.userActivation && !navigator.userActivation.isActive) return;
  const el = document.documentElement;
  try {
    const p = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

function exitFullscreen() {
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      const p = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      if (p && p.catch) p.catch(() => {});
    }
  } catch (e) {}
}

// Main loop
let lastAuto = 0;
function loop(time) {
  frame++;

  // Fade previous frame to create trails
  ctx.globalCompositeOperation = "destination-out";
  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
  ctx.fillRect(0, 0, W, H);

  // Sky flash on explosion
  if (flash > 0) {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(255, 255, 255, ${flash * 0.15})`;
    ctx.fillRect(0, 0, W, H);
    flash -= 0.01;
  }

  ctx.globalCompositeOperation = "lighter";

  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    if (r.update()) {
      if (r.onExplode) r.onExplode(r.x, r.y, r.hue);
      else explode(r.x, r.y, r.hue);
      playBoom(r.x, r.onExplode ? 0.5 : 1); // text shells come many at once, keep each softer
      rockets.splice(i, 1);
    } else {
      r.draw();
    }
  }

  for (let i = writings.length - 1; i >= 0; i--) {
    if (writings[i].update()) writings.splice(i, 1);
    else writings[i].draw();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.update()) {
      particles.splice(i, 1);
    } else {
      p.draw();
    }
  }
  ctx.globalAlpha = 1;

  if (autoLaunch && time - lastAuto > rand(500, 1100)) {
    randomLaunch();
    lastAuto = time;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Interaction
document.addEventListener("pointerdown", initAudio); // unlock audio on any click/tap

// The page opens straight into the show, but browsers only allow sound and fullscreen after
// a user gesture. So the first tap during the show turns both on. Browsers only count
// click / touchend / keydown as that gesture (not pointerdown), so listen to those.
function unlockShow() {
  initAudio();
  if (showRunning && !(document.fullscreenElement || document.webkitFullscreenElement)) enterFullscreen();
}
document.addEventListener("click", unlockShow);
document.addEventListener("touchend", unlockShow);
document.addEventListener("keydown", unlockShow);
canvas.addEventListener("pointerdown", (e) => {
  if (showRunning) return; // the show is a pure viewing space
  initAudio();
  launch(e.clientX, e.clientY);
});

// Hold anywhere for EXIT_HOLD_MS to leave the show (no visual feedback, pure viewing space)
let holdTimer = null;

function startHold() {
  if (!showRunning) return;
  cancelHold();
  holdTimer = setTimeout(() => {
    cancelHold();
    stopShow();
  }, EXIT_HOLD_MS);
}

function cancelHold() {
  clearTimeout(holdTimer);
  holdTimer = null;
}

document.addEventListener("pointerdown", startHold);
document.addEventListener("pointerup", cancelHold);
document.addEventListener("pointercancel", cancelHold);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) cancelHold(); // the finger-up event never arrives after switching apps
});
document.addEventListener("contextmenu", (e) => {
  if (showRunning) e.preventDefault(); // long-press menu on touch devices
});

// Text input: prefilled with the presets, remembered between visits
const TEXT_STORAGE_KEY = "fireworks-show-texts";
const textInput = document.getElementById("textInput");
let savedTexts = null;
try {
  savedTexts = localStorage.getItem(TEXT_STORAGE_KEY);
} catch (e) {}
textInput.value =
  savedTexts !== null ? savedTexts : SHOW_TEXTS.map((t) => t.replace(/\n/g, " | ")).join("\n");
textInput.addEventListener("input", () => {
  try {
    localStorage.setItem(TEXT_STORAGE_KEY, textInput.value);
  } catch (e) {}
});

const soundBtn = document.getElementById("soundBtn");
soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "🔊 Âm thanh" : "🔇 Tắt tiếng";
  soundBtn.classList.toggle("active", soundOn);
  if (masterGain) masterGain.gain.value = soundOn ? MASTER_VOLUME : 0;
});

const autoBtn = document.getElementById("autoBtn");
function setAuto(on) {
  autoLaunch = on;
  autoBtn.textContent = `Tự động: ${on ? "BẬT" : "TẮT"}`;
  autoBtn.classList.toggle("active", on);
}
autoBtn.addEventListener("click", () => setAuto(!autoLaunch));

const showBtn = document.getElementById("showBtn");
showBtn.addEventListener("click", runShow);

const styleBtn = document.getElementById("styleBtn");
function renderStyleBtn() {
  styleBtn.textContent = textStyle === "burst" ? "Chữ: Nổ thành hình 💥" : "Chữ: Que pháo bông ✨";
}
renderStyleBtn();
styleBtn.addEventListener("click", () => {
  textStyle = textStyle === "burst" ? "sparkler" : "burst";
  renderStyleBtn();
  try {
    localStorage.setItem(STYLE_STORAGE_KEY, textStyle);
  } catch (e) {}
});

document.getElementById("burstBtn").addEventListener("click", () => {
  initAudio();
  salvo(BURST_COUNT);
});

// Open straight into the show (sound + fullscreen switch on at the first tap)
runShow();
</script>
</body>
